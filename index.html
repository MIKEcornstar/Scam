<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine</title>
<style>
    body {
        background: linear-gradient(135deg, #ff9ec4, #ff6b81);
        height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Comic Sans MS", cursive, sans-serif;
        overflow: hidden;
        color: white;
        text-align: center;
    }

    h1 {
        font-size: 3rem;
        text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        margin-bottom: 40px;
    }

    .buttons {
        display: flex;
        gap: 30px;
        justify-content: center;
    }

    button {
        padding: 15px 35px;
        font-size: 1.3rem;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.2s;
    }

    #yesBtn {
        background-color: #ff1744;
        color: white;
        box-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    #yesBtn:hover {
        background-color: #ff4569;
        transform: scale(1.1);
    }

    #noBtn {
        background-color: #ffffff;
        color: #ff1744;
        position: absolute;
    }

    .heart {
        position: absolute;
        color: white;
        font-size: 2rem;
        animation: floatUp 6s linear infinite;
        opacity: 0.8;
    }

    @keyframes floatUp {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-800px); opacity: 0; }
    }

    .burst-heart {
        position: absolute;
        font-size: 2rem;
        animation: burst 1s ease-out forwards;
    }

    @keyframes burst {
        0% { transform: scale(0); opacity: 1; }
        100% { transform: scale(3); opacity: 0; }
    }
</style>
</head>
<body>

<audio id="bgMusic" autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7b2b8b0c8d.mp3?filename=romantic-music-110397.mp3" type="audio/mpeg">
</audio>

<h1>Rebeka, will you be my Valentine?</h1>

<div class="buttons">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
</div>

<script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    document.addEventListener("mousemove", (e) => {
        const rect = noBtn.getBoundingClientRect();
        const distance = Math.hypot(
            e.clientX - (rect.left + rect.width / 2),
            e.clientY - (rect.top + rect.height / 2)
        );

        if (distance < 180) {
            const newX = Math.random() * (window.innerWidth - rect.width);
            const newY = Math.random() * (window.innerHeight - rect.height);
            noBtn.style.left = newX + "px";
            noBtn.style.top = newY + "px";
        }
    });

    function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.bottom = "-20px";
        heart.style.fontSize = (Math.random() * 20 + 20) + "px";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
    }

    setInterval(createHeart, 500);

    yesBtn.addEventListener("click", () => {
        for (let i = 0; i < 20; i++) {
            const burst = document.createElement("div");
            burst.classList.add("burst-heart");
            burst.innerHTML = "💖";
            burst.style.left = (window.innerWidth / 2) + (Math.random() * 200 - 100) + "px";
            burst.style.top = (window.innerHeight / 2) + (Math.random() * 200 - 100) + "px";
            document.body.appendChild(burst);
            setTimeout(() => burst.remove(), 1000);
        }

        setTimeout(() => {
            alert("YAY! ❤️ She said YES!");
        }, 300);
    });
</script>

</body>
</html>
